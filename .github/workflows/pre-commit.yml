---
name: pre-commit

# Runs every hook in .pre-commit-config.yaml: whitespace and YAML hygiene,
# ruff (lint + format), mypy, bandit, yamllint. The hooks are the same ones a
# contributor gets from `pre-commit install`, so this catches the case where
# someone has not installed them.
#
# Kept separate from ci.yml because it is fast and version-independent, and
# because a formatting failure should be distinguishable at a glance from a
# test failure.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
