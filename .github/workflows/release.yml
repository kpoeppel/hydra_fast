name: Release

# Publishes to PyPI when a GitHub Release is published, via trusted
# publishing -- no API token is stored anywhere.
#
# BEFORE THE FIRST RELEASE, register the trusted publisher on PyPI. The
# project does not exist there yet, so this is the "pending publisher" flow:
#
#   https://pypi.org/manage/account/publishing/
#     PyPI project name : hydra-fast
#     Owner             : kpoeppel
#     Repository name   : hydra_fast
#     Workflow name     : release.yml
#     Environment name  : pypi
#
# Then create the `pypi` environment under Settings -> Environments (adding a
# required reviewer there is worth it: it turns publishing into an explicit
# approval step).
#
# To release:
#   1. bump `version` in pyproject.toml and note it in CHANGELOG.md
#   2. git tag vX.Y.Z && git push --tags
#   3. publish a GitHub Release for that tag
#
# `workflow_dispatch` rehearses everything except the upload, so the build and
# the checks can be exercised before any of the above is in place.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Do not publish something that was never tested. A tag can point at a
    # commit CI never ran on, so the whole suite runs again here against
    # exactly what is about to be uploaded.
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - name: Verify the tag matches the packaged version
        # Skipped on workflow_dispatch, where there is no tag to compare.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          packaged=$(python -c 'import sys; sys.path.insert(0, "src"); from hydra_fast.version import __version__; print(__version__)')
          tagged="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME packaged=$packaged"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged in pyproject.toml"
            exit 1
          fi

      - name: Confirm the builtin config tree is in the distribution
        # The one package-data regression that no import would catch; it broke
        # once already. See tests/test_packaging.py.
        run: |
          count=$(python -c "
          import glob, zipfile
          z = zipfile.ZipFile(glob.glob('dist/*.whl')[0])
          print(sum(1 for n in z.namelist() if n.startswith('hydra_fast/conf/hydra/') and n.endswith('.yaml')))
          ")
          echo "builtin hydra configs in wheel: $count"
          test "$count" -eq 12 || { echo "::error::expected 12, got $count"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    needs: build
    # Only a published Release uploads. A manual dispatch stops after `build`,
    # so it stays a rehearsal rather than an accidental publish.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # Mandatory for trusted publishing; this is why no secret is needed.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/hydra-fast
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
