---
# Covers everything compoconf's setup does -- formatting, import order,
# linting, type checking, security, YAML and whitespace hygiene -- plus the
# file-hygiene hooks it leaves commented out.
#
# ruff stands in for black, flake8 and isort, which it subsumes entirely; this
# repository already configures it in pyproject.toml at 95 columns with a
# deliberate rule selection. Running black at 120 alongside would reformat
# every file and then disagree with ruff on every commit.
#
# pylint is *not* subsumed, so it runs too. ruff's PL family covers most of it
# and pyproject.toml disables that overlap, leaving the checks ruff has no
# equivalent for.
#
# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9 # keep in step with the version CI's lint job installs
    hooks:
      - id: ruff # lint: E, F, W, I (imports), B, C4, SIM
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        # mypy needs the real signatures of anything it type-checks against.
        # PyYAML is the only runtime dependency; the rest are what the typed
        # test and bench modules import.
        additional_dependencies:
          - types-PyYAML
        # `files` rather than the default, so it checks exactly what
        # [tool.mypy] declares: the package, not tests or bench scripts.
        files: ^src/hydra_fast/
        args: [--config-file=pyproject.toml]

  - repo: https://github.com/pylint-dev/pylint
    rev: v3.3.8
    hooks:
      - id: pylint
        # Runs *alongside* ruff, not instead of it: ruff's PL family covers
        # most of pylint already, so pyproject.toml disables the overlap and
        # leaves the checks ruff has no equivalent for. Only the package is
        # checked -- the same scope [tool.mypy] uses.
        files: ^src/hydra_fast/
        args: [--rcfile=pyproject.toml]
        additional_dependencies:
          - PyYAML

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [--configfile=pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint]
